<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourier Circle Studio</title>
  <script src="vendor/p5.min.js"></script>
  <script src="src/core.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/studio.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; background: #0b0b0f; color: #eee; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #panel { width: 290px; flex: none; padding: 16px; overflow-y: auto; background: #15151c; border-right: 1px solid #2a2a35; }
    #stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    .row { margin-bottom: 12px; }
    label { display: block; color: #aaa; margin-bottom: 4px; }
    label.inline { display: flex; align-items: center; gap: 6px; color: #ddd; }
    input[type=range], input[type=text], select { width: 100%; }
    input[type=text], select { background: #0b0b0f; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 5px; }
    button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer; background: #e0245e; color: #fff; }
    button.recording { background: #444; }
    #status { margin-top: 10px; min-height: 1.4em; color: #4ade80; }
    #status.warn { color: #fbbf24; }
    #status.error { color: #f87171; }
    .hint { color: #777; font-size: 12px; }
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #panel { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #2a2a35; }
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Fourier Circle Studio</h1>

    <div class="row">
      <label for="imageUpload">Image (line art / silhouette works best)</label>
      <input type="file" id="imageUpload" accept="image/*,.svg">
      <div class="hint">…or drop an image anywhere.</div>
    </div>
    <div class="row">
      <label for="threshold">Darkness threshold: <span id="thresholdVal"></span></label>
      <input type="range" id="threshold" min="10" max="245" value="128">
      <label class="inline"><input type="checkbox" id="invert"> Light lines on dark background</label>
    </div>

    <div class="row">
      <label for="format">Video format</label>
      <select id="format">
        <option value="9:16">9:16 — TikTok / Reels / Shorts</option>
        <option value="1:1">1:1 — Square</option>
        <option value="16:9">16:9 — YouTube</option>
      </select>
    </div>
    <div class="row">
      <label for="circles">Circles: <span id="circlesVal"></span></label>
      <input type="range" id="circles" min="1" max="1" value="1">
      <label class="inline"><input type="checkbox" id="buildUp"> Build-up mode (2 → 10 → 50 → … → all)</label>
    </div>
    <div class="row">
      <label for="duration">Seconds per drawing: <span id="durationVal"></span></label>
      <input type="range" id="duration" min="3" max="30" value="10">
    </div>
    <div class="row">
      <label for="zoom">Follow-zoom: <span id="zoomVal"></span></label>
      <input type="range" id="zoom" min="1" max="10" step="0.5" value="1">
    </div>
    <div class="row">
      <label for="color">Trail color</label>
      <input type="color" id="color" value="#ff3366">
      <label class="inline"><input type="checkbox" id="rainbow"> Rainbow trail</label>
    </div>
    <div class="row">
      <label for="title">Title on video</label>
      <input type="text" id="title" placeholder="e.g. Drawing my cat with circles">
      <label class="inline"><input type="checkbox" id="showCount" checked> Show circle count</label>
    </div>

    <div class="row">
      <label class="inline"><input type="checkbox" id="sound"> Sound (preview + recording)</label>
    </div>

    <button id="record">● Record video</button>
    <div class="hint">Recording restarts the animation, captures one full run, and downloads automatically. Keep this tab visible while recording.</div>
    <div id="status"></div>
  </div>
  <div id="stage"></div>

  <script src="src/ui.js"></script>
</body>
</html>
