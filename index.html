<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourier Circle Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; background: #0b0b0f; color: #eee; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #panel { width: 290px; flex: none; padding: 16px; overflow-y: auto; background: #15151c; border-right: 1px solid #2a2a35; }
    #stage { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 16px; margin: 0 0 14px; }
    .row { margin-bottom: 12px; }
    label { display: block; color: #aaa; margin-bottom: 4px; }
    label.inline { display: flex; align-items: center; gap: 6px; color: #ddd; }
    input[type=range], input[type=text], select { width: 100%; }
    input[type=text], select { background: #0b0b0f; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 5px; }
    button { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border: 0; border-radius: 6px; cursor: pointer; background: #e0245e; color: #fff; }
    button.recording { background: #444; }
    #status { margin-top: 10px; min-height: 1.4em; color: #4ade80; }
    #status.warn { color: #fbbf24; }
    #status.error { color: #f87171; }
    .hint { color: #777; font-size: 12px; }
    @media (max-width: 700px) {
      body { flex-direction: column; }
      #panel { width: 100%; max-height: 45vh; border-right: 0; border-bottom: 1px solid #2a2a35; }
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Fourier Circle Studio</h1>

    <div class="row">
      <label for="imageUpload">Image (line art / silhouette works best)</label>
      <input type="file" id="imageUpload" accept="image/*">
      <div class="hint">…or drop an image anywhere.</div>
    </div>
    <div class="row">
      <label for="threshold">Darkness threshold: <span id="thresholdVal"></span></label>
      <input type="range" id="threshold" min="10" max="245" value="128">
      <label class="inline"><input type="checkbox" id="invert"> Light lines on dark background</label>
    </div>

    <div class="row">
      <label for="format">Video format</label>
      <select id="format">
        <option value="9:16">9:16 — TikTok / Reels / Shorts</option>
        <option value="1:1">1:1 — Square</option>
        <option value="16:9">16:9 — YouTube</option>
      </select>
    </div>
    <div class="row">
      <label for="circles">Circles: <span id="circlesVal"></span></label>
      <input type="range" id="circles" min="1" max="1" value="1">
      <label class="inline"><input type="checkbox" id="buildUp"> Build-up mode (2 → 10 → 50 → … → all)</label>
    </div>
    <div class="row">
      <label for="duration">Seconds per drawing: <span id="durationVal"></span></label>
      <input type="range" id="duration" min="3" max="30" value="10">
    </div>
    <div class="row">
      <label for="zoom">Follow-zoom: <span id="zoomVal"></span></label>
      <input type="range" id="zoom" min="1" max="10" step="0.5" value="1">
    </div>
    <div class="row">
      <label for="color">Trail color</label>
      <input type="color" id="color" value="#ff3366">
      <label class="inline"><input type="checkbox" id="rainbow"> Rainbow trail</label>
    </div>
    <div class="row">
      <label for="title">Title on video</label>
      <input type="text" id="title" placeholder="e.g. Drawing my cat with circles">
      <label class="inline"><input type="checkbox" id="showCount" checked> Show circle count</label>
    </div>

    <button id="record">● Record video</button>
    <div class="hint">Recording restarts the animation, captures one full run, and downloads automatically. Keep this tab visible while recording.</div>
    <div id="status"></div>
  </div>
  <div id="stage"></div>

  <script>
    const SIZES = { '9:16': [1080, 1920], '1:1': [1080, 1080], '16:9': [1920, 1080] };
    const FPS = 60;
    const HOLD_FRAMES = 90;           // pause on the finished drawing (1.5 s)
    const MAX_EDGE_POINTS = 5000;     // cap before ordering (greedy ordering is O(n²))
    const MAX_POINTS = 1000;          // cap before the DFT (O(n²))
    const BUILD_UP_LEVELS = [2, 10, 50, 200];
    const MIME_TYPES = ['video/mp4;codecs=avc1.640028', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];

    const $ = id => document.getElementById(id);
    const num = id => parseFloat($(id).value);

    let cnv;
    let fourier = [];                  // sorted by amplitude, largest first
    let trail = [], t = 0, phase = 'draw', holdFrames = 0;
    let levels = [], levelIndex = 0;
    let cam = { x: 0, y: 0, z: 1 };
    let sourceImage = null;
    let recorder = null;

    function setup() {
      pixelDensity(1);                 // canvas pixels == video pixels
      frameRate(FPS);
      cnv = createCanvas(...SIZES[$('format').value]);
      cnv.parent('stage');
      fitCanvas();
      bindUI();
      setFourier(heartPoints(), 'Demo heart loaded — upload an image to trace your own.');
    }

    function bindUI() {
      $('imageUpload').addEventListener('change', e => loadFile(e.target.files[0]));
      document.addEventListener('dragover', e => e.preventDefault());
      document.addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

      $('threshold').addEventListener('change', reprocess);
      $('invert').addEventListener('change', reprocess);
      $('format').addEventListener('change', () => { resizeCanvas(...SIZES[$('format').value]); fitCanvas(); restart(); });
      $('circles').addEventListener('input', restartCycle);
      $('buildUp').addEventListener('change', () => { $('circles').disabled = $('buildUp').checked; restart(); });
      $('record').addEventListener('click', () => recorder ? recorder.stop() : startRecording());
      for (const id of ['threshold', 'circles', 'duration', 'zoom']) $(id).addEventListener('input', updateLabels);
      updateLabels();
    }

    function updateLabels() {
      $('thresholdVal').textContent = $('threshold').value;
      $('circlesVal').textContent = `${$('circles').value} / ${fourier.length}`;
      $('durationVal').textContent = `${$('duration').value}s`;
      $('zoomVal').textContent = num('zoom') === 1 ? 'off' : `${$('zoom').value}×`;
    }

    function setStatus(msg, kind = '') {
      $('status').textContent = msg;
      $('status').className = kind;
    }

    function fitCanvas() {
      const stage = $('stage');
      const s = Math.min((stage.clientWidth - 24) / width, (stage.clientHeight - 24) / height);
      cnv.elt.style.width = `${width * s}px`;
      cnv.elt.style.height = `${height * s}px`;
    }

    function windowResized() { fitCanvas(); }

    // ---------- Animation ----------

    function restart() {
      levelIndex = 0;
      cam = { x: 0, y: 0, z: 1 };
      restartCycle();
    }

    function restartCycle() {
      t = 0;
      trail = [];
      phase = 'draw';
      holdFrames = 0;
    }

    function nextCycle() {
      const last = !$('buildUp').checked || levelIndex === levels.length - 1;
      if (last && recorder) recorder.stop();
      levelIndex = last ? 0 : levelIndex + 1;
      restartCycle();
    }

    function currentCount() {
      return $('buildUp').checked ? levels[levelIndex] : parseInt($('circles').value);
    }

    function draw() {
      background(11);
      if (!fourier.length) return;

      const count = currentCount();
      const S = Math.min(width, height) * 0.42;   // drawing size in pixels

      if (phase === 'draw') {
        const frames = num('duration') * FPS;
        // Sub-step so the trail stays smooth when there are more points than frames.
        const steps = constrain(Math.ceil(fourier.length / frames), 1, 8);
        if (!trail.length) trail.push(chain(0, count, S).at(-1));
        for (let i = 0; i < steps; i++) {
          t = Math.min(TWO_PI, t + TWO_PI / frames / steps);
          trail.push(chain(t, count, S).at(-1));
        }
        if (t >= TWO_PI) phase = 'hold';
      } else if (++holdFrames > HOLD_FRAMES) {
        nextCycle();
      }

      const joints = chain(t, count, S);
      const tip = joints.at(-1);

      // Camera: follow the pen while drawing, ease back out to reveal the result.
      const zoom = num('zoom');
      const follow = phase === 'draw' && zoom > 1;
      const posK = follow ? 0.5 : 0.08;
      cam.x = lerp(cam.x, follow ? tip.x : 0, posK);
      cam.y = lerp(cam.y, follow ? tip.y : 0, posK);
      cam.z = lerp(cam.z, follow ? zoom : 1, 0.08);

      push();
      translate(width / 2, height / 2);
      scale(cam.z);
      translate(-cam.x, -cam.y);
      drawTrail(cam.z);
      const circleAlpha = phase === 'draw' ? 1 : Math.max(0, 1 - holdFrames / 20);
      if (circleAlpha > 0) drawEpicycles(joints, circleAlpha, cam.z);
      pop();

      drawOverlay(count);
    }

    // Joint positions of the first `count` epicycles at time t (in pixels).
    function chain(t, count, S) {
      let x = 0, y = 0;
      const pts = [{ x, y, r: 0 }];
      for (let i = 0; i < count; i++) {
        const f = fourier[i];
        const r = f.amp * S;
        const a = f.freq * t + f.phase;
        x += r * Math.cos(a);
        y += r * Math.sin(a);
        pts.push({ x, y, r });
      }
      return pts;
    }

    function drawEpicycles(pts, alpha, z) {
      noFill();
      for (let i = 1; i < pts.length; i++) {
        const { r } = pts[i];
        if (r * z < 0.5) continue;
        strokeWeight(1.5 / z);
        stroke(255, 55 * alpha);
        circle(pts[i - 1].x, pts[i - 1].y, r * 2);
        stroke(255, 150 * alpha);
        line(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
      }
      const tip = pts.at(-1);
      noStroke();
      fill(255, 255 * alpha);
      circle(tip.x, tip.y, 10 / z);
    }

    function drawTrail(z) {
      const n = trail.length;
      if (n < 2) return;
      const rainbow = $('rainbow').checked;
      const base = $('color').value;
      const chunk = Math.max(2, Math.ceil(n / 150));   // color changes per chunk, not per segment
      noFill();
      strokeJoin(ROUND);
      strokeCap(ROUND);
      // Pass 0: wide translucent glow. Pass 1: crisp core line.
      for (const [w, a] of [[16, 45], [4, 255]]) {
        strokeWeight(w / z);
        for (let s = 0; s < n - 1; s += chunk) {
          const c = color(rainbow ? `hsl(${Math.round(s / n * 360)}, 100%, 60%)` : base);
          c.setAlpha(a);
          stroke(c);
          beginShape();
          for (let i = s; i <= Math.min(s + chunk, n - 1); i++) vertex(trail[i].x, trail[i].y);
          endShape();
        }
      }
    }

    function drawOverlay(count) {
      const size = Math.min(width, height) * 0.06;
      const title = $('title').value.trim();
      noStroke();
      fill(255);
      textStyle(BOLD);
      drawingContext.shadowColor = 'rgba(0,0,0,0.85)';
      drawingContext.shadowBlur = 14;
      if (title) {
        textSize(size);
        textAlign(CENTER, TOP);
        text(title, width * 0.06, height * 0.06, width * 0.88);
      }
      if ($('showCount').checked) {
        textSize(size * 0.9);
        textAlign(CENTER, BOTTOM);
        text(`${count} circle${count === 1 ? '' : 's'}`, width / 2, height * 0.94);
      }
      drawingContext.shadowBlur = 0;
    }

    // ---------- Recording ----------

    function startRecording() {
      if (!window.MediaRecorder || !cnv.elt.captureStream) {
        setStatus('Recording is not supported in this browser.', 'error');
        return;
      }
      const mimeType = MIME_TYPES.find(m => MediaRecorder.isTypeSupported(m));
      const rec = new MediaRecorder(cnv.elt.captureStream(FPS), { ...(mimeType && { mimeType }), videoBitsPerSecond: 16e6 });
      const chunks = [];
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const type = rec.mimeType || 'video/webm';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(chunks, { type }));
        a.download = `fourier-${Date.now()}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        recorder = null;
        $('record').textContent = '● Record video';
        $('record').classList.remove('recording');
        setStatus(`Saved ${a.download}`);
      };

      restart();
      rec.start();
      recorder = rec;
      const cycles = $('buildUp').checked ? levels.length : 1;
      const seconds = Math.round(cycles * (num('duration') + HOLD_FRAMES / FPS));
      $('record').textContent = '■ Stop & save';
      $('record').classList.add('recording');
      setStatus(`Recording… about ${seconds}s`, 'warn');
    }

    // ---------- Image → path → Fourier series ----------

    function loadFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        setStatus('Please choose an image file.', 'error');
        return;
      }
      if (file.type === 'image/svg+xml' || /\.svg$/i.test(file.name)) {
        loadSvg(file);
        return;
      }
      const url = URL.createObjectURL(file);
      setStatus('Loading image…', 'warn');
      loadImage(url,
        img => { URL.revokeObjectURL(url); sourceImage = img; reprocess(); },
        () => { URL.revokeObjectURL(url); setStatus('Could not read that image.', 'error'); });
    }

    function reprocess() {
      if (!sourceImage) return;
      setStatus('Tracing image…', 'warn');
      setTimeout(() => {   // let the status paint before the heavy work
        const pts = pointsFromImage(sourceImage.get());
        if (pts) setFourier(pts, `Traced with ${Math.min(pts.length, MAX_POINTS)} circles.`);
        else setStatus('No lines found — try moving the threshold or toggling the light/dark option.', 'error');
      }, 30);
    }

    // Vector input: sample the real curves instead of rasterizing, so the path is smooth.
    async function loadSvg(file) {
      setStatus('Tracing SVG…', 'warn');
      sourceImage = null;   // threshold / invert only apply to bitmaps
      let pts = null;
      try {
        pts = pointsFromSvg(await file.text());
      } catch (err) {
        console.error(err);
      }
      if (pts) setFourier(pts, `Traced SVG with ${pts.length} circles.`);
      else setStatus('No drawable shapes found in that SVG.', 'error');
    }

    function pointsFromSvg(text) {
      const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
      if (doc.documentElement.nodeName !== 'svg') return null;

      // The SVG must be in the live document for lengths and transforms to work.
      const host = document.createElement('div');
      host.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden';
      host.appendChild(document.importNode(doc.documentElement, true));
      document.body.appendChild(host);
      try {
        const shapes = [...host.querySelectorAll('path, circle, ellipse, rect, line, polyline, polygon')]
          .filter(el => !el.closest('defs, clipPath, mask, symbol, marker, pattern'))
          .map(el => ({ el, len: el.getTotalLength() }))
          .filter(s => s.len > 0);
        if (!shapes.length) return null;

        // Spread points over shapes in proportion to their length, evenly along each one.
        const total = shapes.reduce((sum, s) => sum + s.len, 0);
        const pieces = shapes.map(({ el, len }) => {
          const n = Math.max(2, Math.round(MAX_POINTS * len / total));
          const ctm = el.getCTM();
          return Array.from({ length: n }, (_, j) => {
            const p = el.getPointAtLength(len * j / (n - 1)).matrixTransform(ctm);
            return [p.x, p.y];
          });
        });
        return evenlySample(orderPieces(pieces).flat(), MAX_POINTS);
      } finally {
        host.remove();
      }
    }

    // Chain shapes so each starts near where the previous one ended (reversing when that's closer).
    function orderPieces(pieces) {
      const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2;
      const rest = pieces.slice();
      const out = [rest.shift()];
      while (rest.length) {
        const end = out.at(-1).at(-1);
        let best = 0, bestD = Infinity, reverse = false;
        rest.forEach((p, i) => {
          const ds = d2(end, p[0]), de = d2(end, p.at(-1));
          if (ds < bestD) { bestD = ds; best = i; reverse = false; }
          if (de < bestD) { bestD = de; best = i; reverse = true; }
        });
        const [next] = rest.splice(best, 1);
        out.push(reverse ? next.reverse() : next);
      }
      return out;
    }

    function setFourier(points, msg) {
      fourier = dft(normalize(points)).sort((a, b) => b.amp - a.amp);
      levels = BUILD_UP_LEVELS.filter(n => n < fourier.length).concat(fourier.length);
      $('circles').max = fourier.length;
      $('circles').value = fourier.length;
      updateLabels();
      restart();
      setStatus(msg);
    }

    // Outline pixels of the "ink" regions, ordered into one continuous path.
    function pointsFromImage(img) {
      const sc = 400 / Math.max(img.width, img.height);
      img.resize(Math.max(1, Math.round(img.width * sc)), Math.max(1, Math.round(img.height * sc)));
      img.loadPixels();
      const { width: w, height: h, pixels: px } = img;
      const th = num('threshold');
      const invert = $('invert').checked;

      const ink = new Uint8Array(w * h);
      for (let i = 0; i < w * h; i++) {
        const j = i * 4;
        if (px[j + 3] < 128) continue;   // transparent = background
        const lum = 0.299 * px[j] + 0.587 * px[j + 1] + 0.114 * px[j + 2];
        ink[i] = (invert ? lum > th : lum < th) ? 1 : 0;
      }

      let edges = [];
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = x + y * w;
          if (!ink[i]) continue;
          if (x === 0 || y === 0 || x === w - 1 || y === h - 1 ||
              !ink[i - 1] || !ink[i + 1] || !ink[i - w] || !ink[i + w]) edges.push([x, y]);
        }
      }
      if (!edges.length) return null;

      edges = evenlySample(edges, MAX_EDGE_POINTS);
      return evenlySample(nearestNeighborOrder(edges), MAX_POINTS);
    }

    function evenlySample(arr, max) {
      if (arr.length <= max) return arr;
      const step = arr.length / max;
      return Array.from({ length: max }, (_, i) => arr[Math.floor(i * step)]);
    }

    // Greedy nearest-neighbor tour so the pen travels between nearby points.
    function nearestNeighborOrder(pts) {
      const rest = pts.slice();
      const out = [rest.pop()];
      while (rest.length) {
        const [cx, cy] = out.at(-1);
        let best = 0, bestD = Infinity;
        for (let i = 0; i < rest.length; i++) {
          const dx = rest[i][0] - cx, dy = rest[i][1] - cy;
          const d = dx * dx + dy * dy;
          if (d < bestD) { bestD = d; best = i; if (d <= 1) break; }   // adjacent pixel: can't do better
        }
        out.push(rest[best]);
        rest[best] = rest.at(-1);
        rest.pop();
      }
      return out;
    }

    // Center the path and scale it so its larger side spans [-1, 1].
    function normalize(points) {
      const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
      const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
      const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
      const half = Math.max(maxX - minX, maxY - minY) / 2 || 1;
      return points.map(([x, y]) => ({ re: (x - cx) / half, im: (y - cy) / half }));
    }

    function dft(x) {
      const N = x.length, out = [];
      for (let k = 0; k < N; k++) {
        let re = 0, im = 0;
        for (let n = 0; n < N; n++) {
          const p = (2 * Math.PI * k * n) / N, c = Math.cos(p), s = Math.sin(p);
          re += x[n].re * c + x[n].im * s;
          im += x[n].im * c - x[n].re * s;
        }
        re /= N;
        im /= N;
        // Signed frequency: bins above N/2 are negative frequencies. Without this,
        // a truncated series (fewer circles) doesn't approximate the shape.
        out.push({ freq: k <= N / 2 ? k : k - N, amp: Math.hypot(re, im), phase: Math.atan2(im, re) });
      }
      return out;
    }

    function heartPoints() {
      return Array.from({ length: 400 }, (_, i) => {
        const a = (i / 400) * Math.PI * 2;
        return [16 * Math.sin(a) ** 3, -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))];
      });
    }
  </script>
</body>
</html>
